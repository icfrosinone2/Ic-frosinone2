<script>
const GEOFENCE=150;
const GEOFENCE_PIETROBONO=400; // solo Pietrobono 400m per GPS ballerino, altre 150m
let PLESSI_BASE=[
 {n:'Pietrobono', lat:41.626603, lon:13.331938, cls:'pietrobono', maps:'https://maps.google.com/?q=41.626603,13.331938', icon:'🏫'},
 {n:'Rinascita', lat:41.639722, lon:13.3425, cls:'rinascita', maps:'https://maps.app.goo.gl/x26Tji7C34tJxsu77', icon:'🌱'},
 {n:'XXIII', lat:41.623487, lon:13.323672, cls:'xxiii', maps:'https://maps.google.com/?q=41.623487,13.323672', icon:'📚'},
 {n:'Verdi', lat:41.622454, lon:13.334451, cls:'verdi', maps:'https://maps.google.com/?q=41.622454,13.334451', icon:'🎵'},
 {n:'Pinocchio', lat:41.6404, lon:13.3501, cls:'pinocchio', maps:'https://maps.app.goo.gl/v2sHzUAjFGAFwMav5?g_st=ac', icon:'🥺'},
 {n:'Spinelli', lat:41.613259, lon:13.336852, cls:'spinelli', maps:'https://maps.google.com/?q=41.613259,13.336852', icon:'⭐'}
];
let PLESSI=[...PLESSI_BASE];
let customPlesso=JSON.parse(localStorage.getItem('plesso_casa_v94')||'null');
if(customPlesso){ PLESSI=[...PLESSI_BASE, customPlesso]; }
function aggiungiCasaDaGPS(){ if(!last){ alert('Aspetta GPS ATTIVO - clicca Aggiorna GPS'); return; } customPlesso={n:'Casa Test - Viale Portogallo 4', lat:last.coords.latitude, lon:last.coords.longitude, cls:'casa', maps:\`https://maps.google.com/?q=\${last.coords.latitude},\${last.coords.longitude}\`, icon:'🏠', isCasa:true}; localStorage.setItem('plesso_casa_v94', JSON.stringify(customPlesso)); PLESSI=[...PLESSI_BASE, customPlesso]; renderPlessiUI(); attivaGPS(); }
function aggiungiCasaManuale(){ let lat=41.6345, lon=13.3350; if(last){lat=last.coords.latitude; lon=last.coords.longitude;} customPlesso={n:'Casa Test - Viale Portogallo 4', lat, lon, cls:'casa', maps:\`https://maps.google.com/?q=\${lat},\${lon}\`, icon:'🏠', isCasa:true}; localStorage.setItem('plesso_casa_v94', JSON.stringify(customPlesso)); PLESSI=[...PLESSI_BASE, customPlesso]; renderPlessiUI(); attivaGPS(); }
function rimuoviCasa(){ if(!confirm('Rimuovere Casa Test?')) return; localStorage.removeItem('plesso_casa_v94'); customPlesso=null; PLESSI=[...PLESSI_BASE]; renderPlessiUI(); attivaGPS(); }
function dist(a,b,c,d){const R=6371e3,toRad=x=>x*Math.PI/180,dLat=toRad(c-a),dLon=toRad(d-b),aa=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(aa),Math.sqrt(1-aa));}
let last=null, vicino=null, html5Qr=null, ultimoQR='', ultimoTempo=0, dentro=false;
function renderPlessiUI(){
  const grid=document.getElementById('gridPlessi'); grid.innerHTML='';
  PLESSI.forEach(pl=>{
    const div=document.createElement('div'); div.className='card-pl '+(pl.cls||'');
    div.innerHTML=\`\${pl.icon||'📍'} \${pl.n}<br><a class="btn-maps" href="\${pl.maps}" target="_blank">Maps</a>\`+(pl.isCasa?'<br><span style="font-size:8px; background:#16a34a; color:white; padding:2px 6px; border-radius:999px">TEST</span>':'');
    grid.appendChild(div);
  });
  const sel=document.getElementById('plessoAnagrafica'); const cur=sel.value; sel.innerHTML=''; PLESSI.forEach(pl=>{const o=document.createElement('option'); o.value=pl.n; o.text=pl.n; sel.appendChild(o);}); if(cur) sel.value=cur;
  const btnR=document.getElementById('btnRimuoviCasa'); const statusC=document.getElementById('casaStatus'); if(customPlesso){ if(btnR) btnR.style.display='inline-block'; if(statusC) statusC.innerHTML='✅ Casa Test attiva: '+customPlesso.n; } else { if(btnR) btnR.style.display='none'; if(statusC) statusC.innerHTML=''; }
}
function beep(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); o.frequency.value=880; o.connect(ctx.destination); o.start(); setTimeout(()=>o.stop(),150);}catch(e){} }
function aggiornaUIBlocco(){
  const btnE=document.getElementById('btnEntrata'), btnU=document.getElementById('btnUscita'), btnC=document.getElementById('btnContinuo'), btnS=document.getElementById('btnSingolo');
  const blocco=document.getElementById('bloccoBox'), ok=document.getElementById('okBox'), badge=document.getElementById('badgeStato');
  if(dentro){ 
    if(btnE) btnE.disabled=false; if(btnU) btnU.disabled=false; if(btnC) btnC.disabled=false; if(btnS) btnS.disabled=false;
    blocco.style.display='none'; ok.style.display='block'; 
    ok.style.background='#16a34a';
    ok.innerHTML='✅ Sei dentro il plesso - Puoi timbrare';
    badge.textContent='GPS ATTIVO - DENTRO'; badge.style.background='#16a34a'; 
  } else { 
    // grace 60 sec: se eri dentro da poco, lascia timbrare
    let isGrace = lastDentroTime && (Date.now()-lastDentroTime < 60000);
    if(isGrace){
      if(btnE) btnE.disabled=false; if(btnU) btnU.disabled=false; if(btnC) btnC.disabled=false; if(btnS) btnS.disabled=false;
      blocco.style.display='none'; ok.style.display='block';
      ok.style.background='#f59e0b';
      ok.innerHTML='⚠️ GPS perso da '+Math.round((Date.now()-lastDentroTime)/1000)+'s ma eri dentro - puoi ancora timbrare 60s';
      badge.textContent='GPS GRACE - DENTRO 60s'; badge.style.background='#f59e0b';
    } else {
      if(btnE) btnE.disabled=true; if(btnU) btnU.disabled=true; if(btnC) btnC.disabled=true; if(btnS) btnS.disabled=true;
      blocco.style.display='block'; ok.style.display='none'; 
      if(last){
        badge.textContent='GPS ATTIVO - FUORI'; badge.style.background='#ef4444';
        blocco.innerHTML='⛔ Sei FUORI dal plesso ('+ (vicino?vicino.n+' '+Math.round(dist(last.coords.latitude,last.coords.longitude,vicino.lat,vicino.lon))+'m':'') +') - Avvicinati (150m, Pietrobono 400m)';
      } else {
        badge.textContent='GPS NON ATTIVO - attendi'; badge.style.background='#64748b';
        blocco.innerHTML='⏳ GPS non attivo - clicca 📍 Aggiorna GPS - Consenti posizione nel browser';
      }
    }
  }
}
let watchId=null;
let lastDentroTime=0;
let lastValidPos=null;
function avviaWatchGPS(){ 
  if(!navigator.geolocation) return; 
  if(watchId) navigator.geolocation.clearWatch(watchId); 
  watchId=navigator.geolocation.watchPosition(p=>{ 
    const acc=Math.round(p.coords.accuracy);
    last=p; 
    lastValidPos=p;
    const lat=p.coords.latitude, lon=p.coords.longitude; 
    let min=1e9,best=null,chips=''; 
    PLESSI.forEach(pl=>{
      const d=dist(lat,lon,pl.lat,pl.lon); 
      const limite=(pl.n==='Pietrobono'?GEOFENCE_PIETROBONO:GEOFENCE); 
      const ok=d<=limite; 
      chips+=\`<span class=chip-dist style="\${ok?'background:#d1fae5; border-color:#16a34a':''}">\${pl.n} \${Math.round(d)}m \${ok?'✅':'⛔'} \${pl.n==='Pietrobono'?'(400m)':''}</span>\`; 
      if(d<min){min=d; best=pl;}
    }); 
    vicino=best; 
    const limiteBest=(best && best.n==='Pietrobono'?GEOFENCE_PIETROBONO:GEOFENCE); 
    let nuovoDentro = min<=limiteBest;
    // Mantieni DENTRO 15s se salto GPS breve
    if(!nuovoDentro && dentro && (Date.now()-lastDentroTime < 15000)){
      // non uscire subito
    } else {
      dentro=nuovoDentro;
      if(dentro) lastDentroTime=Date.now();
    }
    const precEl=document.getElementById('precTop'); if(precEl) precEl.textContent=acc; 
    const vicinoEl=document.getElementById('vicinoBox'); if(vicinoEl) vicinoEl.innerHTML=\`Vicino: <b>\${best.n}</b> a \${Math.round(min)}m \${dentro?'✅ DENTRO':'⛔ FUORI'} \${best && best.n==='Pietrobono'?'🏫 400m':''}\`; 
    document.getElementById('listaDistanze').innerHTML=chips; 
    const statusEl=document.getElementById('coordBox'); if(statusEl) statusEl.innerHTML=\`\${lat.toFixed(5)}, \${lon.toFixed(5)} | ±\${acc}m | GPS AUTO\`; 
    aggiornaUIBlocco(); 
  }, e=>{ 
    console.log('watch errore', e); 
    const box=document.getElementById('coordBox');
    if(box) box.innerHTML='GPS watch errore - riprovo... '+e.message;
  }, {enableHighAccuracy:true, timeout:30000, maximumAge:2000}); 
}
function attivaGPS(){
  if(!navigator.geolocation){ 
    const box=document.getElementById('coordBox');
    if(box) box.innerHTML='GPS non supportato - usa Chrome/Edge';
    return;
  }
  const box=document.getElementById('coordBox');
  if(box) box.innerHTML='📡 Richiedo GPS... consenti posizione';
  navigator.geolocation.getCurrentPosition(p=>{
    const acc=Math.round(p.coords.accuracy);
    last=p; lastValidPos=p;
    const lat=p.coords.latitude, lon=p.coords.longitude;
    let min=1e9,best=null, chips=''; 
    PLESSI.forEach(pl=>{
      const d=dist(lat,lon,pl.lat,pl.lon); 
      const limite=(pl.n==='Pietrobono'?GEOFENCE_PIETROBONO:GEOFENCE);
      const ok=d<=limite; 
      chips+=\`<span class=chip-dist style="\${ok?'background:#d1fae5; border-color:#16a34a':''}">\${pl.n} \${Math.round(d)}m \${ok?'✅':'⛔'} \${pl.n==='Pietrobono'?'(400m)':''}</span>\`; 
      if(d<min){min=d; best=pl;}
    });
    vicino=best; 
    const limiteBest=(best && best.n==='Pietrobono'?GEOFENCE_PIETROBONO:GEOFENCE);
    dentro=min<=limiteBest; 
    if(dentro) lastDentroTime=Date.now();
    const prec=document.getElementById('precTop'); if(prec) prec.textContent=acc; 
    const vicinoEl=document.getElementById('vicinoBox'); if(vicinoEl) vicinoEl.innerHTML=\`Vicino: <b>\${best.n}</b> a \${Math.round(min)}m \${dentro?'✅ DENTRO':'⛔ FUORI'}\`; 
    document.getElementById('listaDistanze').innerHTML=chips; 
    if(box) box.innerHTML=\`\${lat.toFixed(5)}, \${lon.toFixed(5)} | ±\${acc}m | GPS ATTIVO\`; 
    aggiornaUIBlocco();
    // avvia watch dopo primo fix
    setTimeout(()=>avviaWatchGPS(), 800);
  }, e=>{ 
    let msg='GPS errore';
    if(e.code===1) msg='❌ GPS negato - clicca lucchetto e consenti Posizione';
    else if(e.code===2) msg='❌ Posizione non disponibile - attiva Posizione Windows';
    else if(e.code===3) msg='⏳ GPS timeout - riprovo...';
    if(box) box.innerHTML=msg + '<br><button onclick="attivaGPS()" style="margin-top:6px; background:#0ea5e9; color:white; border:0; border-radius:6px; padding:6px 12px; font-weight:800">🔄 Riprova GPS</button>';
    aggiornaUIBlocco(); 
    setTimeout(attivaGPS,5000); 
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
}
function modalitaPC(){ 
  // V53 GPS esatto - non bypassa, solo info
  alert("GPS esatto obbligatorio - Se sei dentro ma GPS non aggancia, clicca 📍 Aggiorna GPS e consenti posizione. Su tablet attiva GPS nelle impostazioni.");
}

  let lock = document.getElementById('pinLock');

function avviaScanner(facingPref){

    let tipoScelto = confirm('QR letto: '+nome+'\\nOK=ENTRATA 🟢 / Annulla=USCITA 🔴') ? 'ENTRATA' : 'USCITA';
    timbra(tipoScelto, nome);

async function caricaAnagraficheCloud(){
  if(typeof FORZA_LISTA_DA_HTML !== 'undefined' && FORZA_LISTA_DA_HTML && typeof LISTA_COMPLETA_DIPENDENTI_V59 !== 'undefined' && LISTA_COMPLETA_DIPENDENTI_V59.length>0){

    localStorage.setItem('anagrafiche_v95', JSON.stringify(anagrafiche));
    try{ saveAnag(); }catch(e){}
    try{ render(); filtraElenco(); }catch(e){}
    return;
  }
  try{
    let status = document.getElementById('cloudAnagStatus');
    if(status) status.innerHTML = '⏳ Carico da cloud...';
    let val = await fetchWithFallback("/anagrafiche.json");
    if(val && Array.isArray(val) && val.length>0){
      console.log('☁️ Anagrafiche cloud caricate:', val.length);
      let localeLen = anagrafiche.length;
      // Se cloud ha dati, usa cloud (più completo)
      // Se locale ha 4 e cloud 0, NON sovrascrivere
      if(val.length>0){
        // Merge intelligente: unisci senza duplicati per nome
        let map = new Map();
        anagrafiche.forEach(a=> map.set(a.nome.toLowerCase(), a));
        val.forEach(a=> map.set(a.nome.toLowerCase(), a));
        anagrafiche = Array.from(map.values());
        // Se cloud più lungo, usa merge
        if(val.length >= localeLen){
          // se cloud più numeroso, prendi cloud + merge
          anagrafiche = val;
          // re-merge locale che non sono in cloud
          let cloudNames = new Set(val.map(x=>x.nome.toLowerCase()));
          let extra = JSON.parse(localStorage.getItem('anagrafiche_v95')||'[]').filter(x=> !cloudNames.has(x.nome.toLowerCase()));
          if(extra.length>0) anagrafiche = [...anagrafiche, ...extra];
        }
        localStorage.setItem('anagrafiche_v95', JSON.stringify(anagrafiche));
        localStorage.setItem('anagrafiche_v90', JSON.stringify(anagrafiche));
        render();
        mostraOrario();
        if(status) status.innerHTML = '✅ Ricevute '+val.length+' da cloud, ora ne hai '+anagrafiche.length+' totali su questo tablet';
      } else {
        if(status) status.innerHTML = '⚠️ Cloud vuoto - clicca Invia per mandare i tuoi 4';
      }
    } else {
      let status2 = document.getElementById('cloudAnagStatus');
      if(status2) status2.innerHTML = '⚠️ Cloud vuoto - hai '+anagrafiche.length+' locali, clicca 📤 Invia per mandarli a tutti';
    }
  }catch(e){ console.log('Errore carica anag cloud', e); let s=document.getElementById('cloudAnagStatus'); if(s) s.innerHTML='❌ Errore cloud: '+e; }
}

const DB_URLS = [
  "https://icfrosinone2-default-rtdb.firebaseio.com",
  "https://icfrosinone2-default-rtdb.europe-west1.firebasedatabase.app"
];
let DB_URL = DB_URLS[0];
async function fetchWithFallback(path){
  for(let base of DB_URLS){
    try{
      const url = base + path + "?ts="+Date.now();
      console.log("☁️ Provo fetch:", url);
      const r = await fetch(url, {cache:"no-store"});
      console.log("☁️ Risposta:", base, r.status, r.ok);
      if(r.ok){
        DB_URL = base;
        const j = await r.json();
        console.log("☁️ Dati ricevuti:", j ? Object.keys(j).length||j.length : 'null');
        return j;
      } else {
        const txt = await r.text();
        console.log("☁️ Errore body:", txt.slice(0,200));
      }
    }catch(e){ console.log("☁️ Fetch errore su", base, e); }
  }
  return null;
}
async function caricaCondivise(){
  try{
    const badge = document.getElementById('statusBadge');
    // NO Caricamento... per non far lampeggiare - resta fisso
    let val = await fetchWithFallback("/timbrature.json");
    if(val){
      let arr = Array.isArray(val) ? val : Object.values(val);
      arr = arr.filter(x=>x && x.data);
      arr.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
      let cancellate = [];
      try{ cancellate = JSON.parse(localStorage.getItem('timbrature_cancellate_v42')||'[]'); }catch(e){}
      const isCancellata = (t) => {
        let key = (t.data||'') + '|' + (t.nome||'') + '|' + (t.tipo||'') + '|' + (t.plesso||'');
        let key2 = key + '|' + (t.ora||'');
        return cancellate.includes(key) || cancellate.includes(key2);
      };
      arr = arr.filter(t=>!isCancellata(t));
      // merge
      let merged = [...arr, ...timbratureSalvate];
      let seen = new Set();
      let uniq = [];
      merged.forEach(t=>{
        let key = (t.data||'') + '|' + (t.nome||'') + '|' + (t.tipo||'') + '|' + (t.plesso||'') + '|' + (t.ora||'');
        if(!seen.has(key)){
          seen.add(key);
          uniq.push(t);
        }
      });
      uniq.sort((a,b)=> (b.timestamp||0)-(a.timestamp||0) );
      timbratureSalvate = uniq.slice(0,500);
      try{ localStorage.setItem('timbrature_v93', JSON.stringify(timbratureSalvate)); }catch(e){}
      aggiornaLog();
      if(badge){ badge.innerHTML = "☁️ Condiviso attivo - "+uniq.length+" timbrature"; badge.style.background="#dcfce7"; badge.style.borderColor="#16a34a"; }
    } else {
      if(badge){ badge.innerHTML = "☁️ Condiviso attivo - "+timbratureSalvate.length+" timbrature"; badge.style.background="#dcfce7"; badge.style.borderColor="#16a34a"; }
      aggiornaLog();
    }
  }catch(e){ 
    console.log("Cloud fetch errore", e); 
    // errore silenzioso, mantieni badge verde fisso
    aggiornaLog();
  }
}

// ===== TOLLERANZA 5 MINUTI V51.2 - NON TOCCA GPS =====
function parseOraMin(oraStr){
  // oraStr "07:35" o "07:35:00" o da timbratura "07:35"
  try{
    let p = (oraStr||'').split(':');
    return parseInt(p[0])*60 + parseInt(p[1]);
  }catch(e){ return 0; }
}
function calcolaRitardoPermesso(t){
  try{
    let tollE = parseInt(localStorage.getItem('tollEntrata')||'5');
    let tollU = parseInt(localStorage.getItem('tollUscita')||'5');
    let anag = anagrafiche.find(a=>a.nome===t.nome);
    if(!anag) return {testo:'', tipo:'', minuti:0};
    let giornoKey = 'lun';
    try{
      let parts = (t.data||'').split(',')[0].split('/');
      if(parts.length===3){
        let d = new Date(parts[2], parts[1]-1, parts[0]);
        let map = ['dom','lun','mar','mer','gio','ven','sab'];
        giornoKey = map[d.getDay()];
      }
    }catch(e){}
    let slots = anag.orariSettimana && anag.orariSettimana[giornoKey] ? anag.orariSettimana[giornoKey] : [];
    if(slots.length===0) return {testo:'', tipo:'', minuti:0};
    let entrataPrevista = slots[0].entrata;
    let uscitaPrevista = slots[slots.length-1].uscita;
    let oraTimbr = parseOraMin(t.ora);
    
    if(t.tipo==='ENTRATA'){
      let oraEntr = parseOraMin(entrataPrevista);
      let limiteTolleranza = oraEntr + tollE; // es 07:30 +5 = 07:35
      // calcolo ritardo deve COMINCIARE alle 07:36
      if(oraTimbr <= limiteTolleranza){
        return {testo:'✅ OK entro tolleranza (fino a '+ (Math.floor(limiteTolleranza/60)).toString().padStart(2,'0') +':'+ String(limiteTolleranza%60).padStart(2,'0') +')', tipo:'ok', minuti:0};
      } else {
        let ritardoEffettivo = oraTimbr - limiteTolleranza; // da 07:36 in poi, es 07:36 = 1 min, 07:40 = 5 min
        let ritardoTotale = oraTimbr - oraEntr;
        return {testo:'⚠️ RITARDO '+ritardoEffettivo+' min (timbro '+t.ora+' - tolleranza fino a '+ (Math.floor(limiteTolleranza/60)).toString().padStart(2,'0') +':'+ String(limiteTolleranza%60).padStart(2,'0') +' - previsto '+entrataPrevista+')', tipo:'ritardo', minuti:ritardoEffettivo, totale:ritardoTotale};
      }
    } else if(t.tipo==='USCITA'){
      let oraUsc = parseOraMin(uscitaPrevista);
      let limitePermesso = oraUsc - tollU; // es 14:42 -5 = 14:37
      // permesso fino alle 14:37
      if(oraTimbr >= limitePermesso){
        return {testo:'✅ OK entro tolleranza (da '+ (Math.floor(limitePermesso/60)).toString().padStart(2,'0') +':'+ String(limitePermesso%60).padStart(2,'0') +' in poi)', tipo:'ok', minuti:0};
      } else {
        let permessoEffettivo = limitePermesso - oraTimbr; // fino alle 14:37, es 14:30 = 7 min
        let permessoTotale = oraUsc - oraTimbr;
        return {testo:'⏰ PERMESSO '+permessoEffettivo+' min (uscito '+t.ora+' - permesso fino a '+ (Math.floor(limitePermesso/60)).toString().padStart(2,'0') +':'+ String(limitePermesso%60).padStart(2,'0') +' - previsto '+uscitaPrevista+')', tipo:'permesso', minuti:permessoEffettivo, totale:permessoTotale};
      }
    }
  }catch(e){ console.log("Errore tolleranza", e); }
  return {testo:'', tipo:'', minuti:0};
}

function calcolaOreLavorateDaTimbrature(nome, daDate, aDate){
  var perGiorno = {};
  timbratureSalvate.forEach(function(t){
    if(t.nome !== nome) return;
    try{
      var parts = (t.data||'').split(',')[0].split('/');
      if(parts.length!==3) return;
      var d = new Date(parts[2], parts[1]-1, parts[0]);
      if(daDate && d < daDate) return;
      if(aDate && d > aDate) return;
      var key = parts[2]+'-'+parts[1]+'-'+parts[0];
      if(!perGiorno[key]) perGiorno[key]=[];
      perGiorno[key].push(t);
    }catch(e){}
  });
  var totaleMinuti = 0;
  var giorniLavorati = 0;
  Object.keys(perGiorno).forEach(function(k){
    var arr = perGiorno[k].sort(function(a,b){ return (a.ora||'').localeCompare(b.ora||''); });
    for(var i=0;i<arr.length-1;i++){
      if(arr[i].tipo==='ENTRATA' && arr[i+1].tipo==='USCITA'){
        try{
          var e = parseOraMin(arr[i].ora);
          var u = parseOraMin(arr[i+1].ora);
          if(u>e){ totaleMinuti += (u-e); }
          i++;
        }catch(e){}
      }
    }
    giorniLavorati++;
  });
  return {minuti: totaleMinuti, giorni: giorniLavorati};
}
function parseTotaleOre(totStr){
  try{
    var m = totStr.match(/(\\d+)h(\\d*)m?/);
    if(!m) return 36*60;
    var h = parseInt(m[1]||'0');
    var mm = parseInt(m[2]||'0');
    return h*60+mm;
  }catch(e){ return 36*60; }
}
function calcolaDovute(anag, daDate, aDate){
  if(!daDate || !aDate){ 
    var oggi = new Date();
    daDate = new Date(oggi.getFullYear(), oggi.getMonth(), 1);
    aDate = new Date(oggi.getFullYear(), oggi.getMonth()+1, 0);
  }
  var totale = 0;
  var d = new Date(daDate);
  while(d <= aDate){
    var day = d.getDay();
    if(day>=1 && day<=5){
      var key = ['dom','lun','mar','mer','gio','ven','sab'][day];
      var slots = anag.orariSettimana && anag.orariSettimana[key] ? anag.orariSettimana[key] : [];
      if(slots.length===0){
        totale += 432;
      } else {
        slots.forEach(function(s){
          try{
            var e = parseOraMin(s.entrata);
            var u = parseOraMin(s.uscita);
            if(u>e) totale += (u-e);
          }catch(e){}
        });
      }
    }
    d.setDate(d.getDate()+1);
  }
  return totale;
}
